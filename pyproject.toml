[project]
name = "bounded-intelligence-lab"
version = "0.1.0"
description = "Reproducible, bounded-resource intelligence research infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "torch>=2.13.0",
]

[project.scripts]
bilab = "bilab.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
